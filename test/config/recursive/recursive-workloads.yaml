        command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
        volumeMounts:
        - name: recursive
          mountPath: /recursive
          readOnly: true
          mountPropagation: HostToContainer
      volumes:
      - name: recursive
        csi:
          driver: "recursive.csi.spiffe.io"
          readOnly: true
